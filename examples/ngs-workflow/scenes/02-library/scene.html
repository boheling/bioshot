<template>
  <style>
    #library-head { top: 190px; width: 1100px; }
    #library-body { top: 790px; width: 1100px; }
  </style>
  <div id="library" class="film" data-composition-id="library" data-width="1920" data-height="1080">
    <div id="library-head" class="head">Cut it into pieces, tag the ends</div>
    <div id="library-body" class="body">Short pieces with an adapter on each end: a library.</div>
  </div>
  <script>
    (function () {
      const S = window.__storyshot, B = window.BioKit, R = B.root('library');
      const q = (s) => R.querySelector(s);
      B.stages(R, Film.stages, 1);
      const lib = B.fragments(R, { x: 250, y: 560, w: 780, pieces: 5, scale: 1.5 });
      const tag = lib.tagAt(2), pc = lib.pieceAt(1);
      const cTag = B.callout(R, { at: tag, to: [tag[0], tag[1] + 90], text: 'adapter', side: 'right' });
      const cPiece = B.callout(R, { at: pc, to: [pc[0], pc[1] - 96], text: 'one piece of DNA', side: 'right' });
      const tl = gsap.timeline({ paused: true });
      B.show(tl, q('#library-head'), 0.1, 0.4);
      // "First the DNA is cut into short pieces." one long molecule, then the cuts
      lib.show(tl, 0.2);
      lib.cut(tl, S.at('cut into short pieces', 0.7));
      cPiece.show(tl, S.at('cut into short pieces', 1.4));
      // "Each piece gets an adapter on both ends, a handle the sequencer can hold."
      lib.tag(tl, S.at('adapter'));
      cTag.show(tl, S.at('adapter', 0.6));
      // "That is a library."
      B.show(tl, q('#library-body'), S.at('That is a library'));
      window.__timelines['library'] = tl;
    })();
  </script>
</template>
